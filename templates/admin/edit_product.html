<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit_product.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Edit Product</h2>

        <form method="POST">

            <div class="image-box">

                <img src="{{ url_for('static', filename='uploads/product_images/' + product.image) }}"
                     alt="{{ product.name }}">

            </div>

            <div class="input-group">

                <label>Product Name</label>

                <input type="text"
                       name="name"
                       value="{{ product.name }}"
                       required>

            </div>

            <div class="input-group">

                <label>Description</label>

                <textarea
                    name="description"
                    rows="5"
                    required>{{ product.description }}</textarea>

            </div>

            <div class="input-group">

                <label>Category</label>

                <input type="text"
                       name="category"
                       value="{{ product.category }}"
                       required>

            </div>

            <div class="input-group">

                <label>Price</label>

                <input type="number"
                       step="0.01"
                       name="price"
                       value="{{ product.price }}"
                       required>

            </div>

            <div class="buttons">

                <a href="/admin/view-products" class="back-btn">
                    ← Back
                </a>

                <button type="submit" class="save-btn">
                    💾 Update Product
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
