<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fc">
  <title>{% block title %}SmartCart{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <header class="navbar-header">
    <nav class="navbar" aria-label="Public navigation">
      <a href="/" class="brand-logo">
        <span class="logo-icon">🛒</span>
        <span class="brand-name">SmartCart</span>
      </a>

      <!-- 1-Button Mobile Navigation Toggle -->
      <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Toggle navigation">
        <span class="toggle-icon">☰</span>
      </button>

      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-item">Home</a>
        <a href="{{ url_for('user_products') }}" class="nav-item">Shop</a>
        <a href="/user-login" class="nav-btn nav-btn-outline">Log in</a>
        <a href="/user-signup" class="nav-btn">Create account</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-text">© 2026 SmartCart. All rights reserved.</div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const mobileToggle = document.getElementById("mobileNavToggle");
      const navLinks = document.getElementById("navLinks");
      const toggleIcon = mobileToggle ? mobileToggle.querySelector(".toggle-icon") : null;

      if (mobileToggle && navLinks) {
        mobileToggle.addEventListener("click", function(e) {
          e.stopPropagation();
          const isShow = navLinks.classList.toggle("show");
          if (toggleIcon) {
            toggleIcon.textContent = isShow ? "✕" : "☰";
          }
        });

        document.addEventListener("click", function(e) {
          if (!navLinks.contains(e.target) && !mobileToggle.contains(e.target)) {
            navLinks.classList.remove("show");
            if (toggleIcon) toggleIcon.textContent = "☰";
          }
        });
      }
    });
  </script>
</body>
</html>
