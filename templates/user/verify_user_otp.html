{% extends "user/base_public.html" %}

{% block title %}
Verify OTP
{% endblock %}

{% block content %}

<h2>User OTP Verification</h2>

<form action="/verify-user-otp" method="POST">

    <label>Enter OTP</label><br>
    <input
        type="number"
        name="otp"
        required
    ><br><br>

    <label>Create Password</label><br>
    <input
        type="password"
        name="password"
        required
    ><br><br>

    <button type="submit">
        Verify OTP
    </button>

</form>

{% endblock %}
